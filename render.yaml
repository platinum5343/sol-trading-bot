services:
  - type: web
    name: sol-trading-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HTTP_API_TOKEN
        value: "your_token_here"
      - key: BOT_USERNAME
        value: "t.me/soltrading_helper_bot"
      - key: ADMIN_ID
        value: "7751385595,5940013895"