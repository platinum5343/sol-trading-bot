services:
  - type: web
    name: sol-trading-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: HTTP_API_TOKEN
        value: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
      - key: BOT_USERNAME
        value: "soltrading_helper_bot"
      - key: ADMIN_ID
        value: "7751385595,5940013895"
      # Using polling mode - the /ping endpoint keeps the service alive