services:
  - type: web
    name: sol-trading-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: HTTP_API_TOKEN
        value: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
      - key: BOT_USERNAME
        value: "soltrading_helper_bot"
      - key: ADMIN_ID
        value: "7751385595,5940013895"
      - key: MONGODB_URI
        value: "mongodb://<botuser>:<olascorp>@ac-wtkdium-shard-00-00.ntsrjma.mongodb.net:27017,ac-wtkdium-shard-00-01.ntsrjma.mongodb.net:27017,ac-wtkdium-shard-00-02.ntsrjma.mongodb.net:27017/?ssl=true&replicaSet=atlas-wlvk73-shard-0&authSource=admin&retryWrites=true&w=majority"
      # Using polling mode - the /ping endpoint keeps the service alive